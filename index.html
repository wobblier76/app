<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hockey Stats Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0e1a;
      --surface: #111827;
      --surface2: #1e2a3a;
      --surface3: #253347;
      --accent-blue: #2563eb;
      --accent-red: #dc2626;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --home-color: #3b82f6;
      --away-color: #ef4444;
      --border: #1e3050;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      overflow: hidden;
    }

    #app {
      display: grid;
      grid-template-columns: 300px 1fr;
      height: 100vh;
    }

    /* ── SIDEBAR ── */
    #sidebar {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow: hidden;
    }

    #sidebar-header {
      padding: 12px 14px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .5px;
      color: #fff;
    }

    #sidebar-scroll {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    #sidebar-scroll::-webkit-scrollbar { width: 4px; }
    #sidebar-scroll::-webkit-scrollbar-track { background: transparent; }
    #sidebar-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .section-title {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--text-muted);
      padding: 10px 14px 4px;
    }

    /* ── TEAM PANELS ── */
    .team-panel { border-bottom: 1px solid var(--border); }

    .team-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: var(--surface2);
    }

    .team-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 13px;
    }

    .team-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

    .team-name-input {
      background: transparent;
      border: none;
      border-bottom: 1px dashed var(--text-muted);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      width: 100px;
      outline: none;
    }

    .btn-add {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--surface3);
      color: var(--text);
      cursor: pointer;
      transition: background .15s;
    }
    .btn-add:hover { background: var(--accent-blue); border-color: var(--accent-blue); }

    .roster-list { padding: 4px 0; min-height: 10px; }

    .player-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px 14px;
      cursor: pointer;
      transition: background .1s;
      border-left: 3px solid transparent;
    }
    .player-item:hover { background: var(--surface2); }
    .player-item.selected { background: var(--surface3); }
    .player-item.selected.home { border-left-color: var(--home-color); }
    .player-item.selected.away { border-left-color: var(--away-color); }

    .jersey-badge {
      width: 26px; height: 26px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700;
      flex-shrink: 0;
    }

    .player-name { flex: 1; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .player-actions { display: flex; gap: 4px; opacity: 0; transition: opacity .1s; }
    .player-item:hover .player-actions { opacity: 1; }

    .icon-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 13px; padding: 2px 3px;
      border-radius: 3px; transition: color .1s, background .1s;
      line-height: 1;
    }
    .icon-btn:hover { color: var(--text); background: var(--surface); }
    .icon-btn.danger:hover { color: var(--accent-red); }

    .inline-form {
      display: flex; gap: 4px; align-items: center;
      padding: 4px 14px;
      background: var(--surface3);
    }
    .inline-form input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      padding: 3px 6px;
      font-size: 12px;
      outline: none;
    }
    .inline-form input:focus { border-color: var(--accent-blue); }
    .inline-form input.num { width: 42px; }
    .inline-form input.name { flex: 1; }
    .btn-confirm { background: var(--accent-blue); border: none; color: #fff; border-radius: 4px; padding: 3px 8px; cursor: pointer; font-size: 11px; }
    .btn-cancel { background: none; border: 1px solid var(--border); color: var(--text-muted); border-radius: 4px; padding: 3px 6px; cursor: pointer; font-size: 11px; }

    /* ── STAT SELECTOR ── */
    #stat-selector { border-bottom: 1px solid var(--border); padding-bottom: 8px; }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      padding: 4px 14px;
    }

    .stat-btn {
      padding: 7px 4px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background .12s, border-color .12s, transform .1s;
      line-height: 1.3;
    }
    .stat-btn:hover { background: var(--surface3); transform: translateY(-1px); }
    .stat-btn.active { background: #1d3a6e; border-color: var(--accent-blue); color: #93c5fd; box-shadow: 0 0 0 1px var(--accent-blue); }

    /* ── STAT FEED ── */
    #stat-feed { flex: 1; min-height: 0; display: flex; flex-direction: column; }

    #feed-list { list-style: none; overflow-y: auto; flex: 1; }
    #feed-list::-webkit-scrollbar { width: 4px; }
    #feed-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .feed-item {
      display: flex; flex-direction: column; gap: 2px;
      padding: 6px 14px; border-bottom: 1px solid var(--border);
      animation: fadeIn .2s ease;
    }
    .feed-item:hover { background: var(--surface2); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

    .feed-row1 { display: flex; align-items: center; gap: 6px; font-size: 12px; }

    .feed-stat-badge {
      font-size: 9px; font-weight: 700;
      padding: 2px 5px; border-radius: 3px;
      background: var(--surface3);
      text-transform: uppercase; letter-spacing: .5px;
      white-space: nowrap;
    }

    .feed-player { font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .feed-time { font-size: 10px; color: var(--text-muted); white-space: nowrap; }
    .feed-row2 { font-size: 10px; color: var(--text-muted); }

    .zone-d { color: #f87171; }
    .zone-n { color: #94a3b8; }
    .zone-o { color: #34d399; }

    .feed-empty { padding: 20px 14px; text-align: center; color: var(--text-muted); font-size: 12px; }

    /* ── RINK AREA ── */
    #rink-area { display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }

    /* ── CLOCK BAR ── */
    #clock-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .period-btns { display: flex; gap: 4px; }

    .period-btn {
      font-size: 11px; font-weight: 700;
      padding: 4px 9px; border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-muted);
      cursor: pointer; transition: all .12s;
    }
    .period-btn:hover { color: var(--text); background: var(--surface3); }
    .period-btn.active { background: #1d3a6e; border-color: var(--accent-blue); color: #93c5fd; }

    #clock-display {
      font-size: 22px; font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 1px;
      color: #fff;
      min-width: 70px; text-align: center;
    }
    #clock-display.running { color: #4ade80; }
    #clock-display.expired { color: #f87171; }

    .clock-step-group { display: flex; gap: 3px; align-items: center; }

    .step-btn {
      font-size: 10px; font-weight: 600;
      padding: 3px 7px; border-radius: 4px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-muted);
      cursor: pointer; transition: all .12s;
    }
    .step-btn:hover { color: var(--text); background: var(--surface3); }

    .clock-sep { color: var(--border); font-size: 10px; }

    #clock-toggle {
      font-size: 11px; font-weight: 700;
      padding: 5px 14px; border-radius: 5px;
      border: 1px solid var(--accent-blue);
      background: #1d3a6e; color: #93c5fd;
      cursor: pointer; transition: all .12s;
      margin-left: 4px;
    }
    #clock-toggle:hover { background: var(--accent-blue); color: #fff; }
    #clock-toggle.running { border-color: #f87171; background: #3a1d1d; color: #f87171; }
    #clock-toggle.running:hover { background: #f87171; color: #fff; }

    /* ── STATUS STRIP ── */
    #status-strip {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 16px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      font-size: 12px; min-height: 36px; flex-wrap: wrap;
    }

    .status-chip {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600;
      border: 1px solid var(--border);
    }

    .status-arrow { color: var(--text-muted); }
    .status-hint { color: var(--text-muted); font-size: 11px; margin-left: auto; }

    #rink-wrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 12px; min-height: 0;
    }

    #rink-svg {
      width: 100%; height: 100%; max-height: 100%;
      filter: drop-shadow(0 4px 24px rgba(0,0,0,.5));
    }

    #rink-svg .rink-deco { pointer-events: none; }
    #ice-click-layer { pointer-events: all; fill: transparent; cursor: crosshair; }

    .stat-marker { pointer-events: all; cursor: pointer; }
    .stat-marker:hover { opacity: .8; }

    /* ── MODAL ── */
    #modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.7); z-index: 100;
      align-items: center; justify-content: center;
    }
    #modal-overlay.open { display: flex; }

    #modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; width: 480px; max-width: 95vw; max-height: 80vh;
      display: flex; flex-direction: column; overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,.6);
    }

    #modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; border-bottom: 1px solid var(--border);
    }
    #modal-title { font-size: 16px; font-weight: 700; }
    #modal-close {
      background: none; border: none; color: var(--text-muted);
      font-size: 20px; cursor: pointer; padding: 2px 6px; border-radius: 4px;
    }
    #modal-close:hover { color: var(--text); background: var(--surface2); }
    #modal-body { overflow-y: auto; padding: 16px 20px; flex: 1; }

    .stat-summary-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 8px; margin-bottom: 16px;
    }
    .summary-card { background: var(--surface2); border-radius: 8px; padding: 10px; text-align: center; }
    .summary-card .sc-num { font-size: 22px; font-weight: 700; }
    .summary-card .sc-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }

    .modal-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .modal-table th {
      text-align: left; padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted); font-size: 10px;
      text-transform: uppercase; letter-spacing: .5px;
    }
    .modal-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); }
    .modal-table tr:last-child td { border-bottom: none; }
    .modal-table tr:hover td { background: var(--surface2); }
    .no-stats { color: var(--text-muted); text-align: center; padding: 24px; font-size: 13px; }

    /* ── CONTROLS BAR ── */
    #controls-bar {
      display: flex; gap: 8px; padding: 7px 16px;
      background: var(--surface); border-top: 1px solid var(--border);
      align-items: center;
    }
    .ctrl-btn {
      font-size: 11px; padding: 4px 10px; border-radius: 5px;
      border: 1px solid var(--border); background: var(--surface2);
      color: var(--text-muted); cursor: pointer; transition: all .12s;
    }
    .ctrl-btn:hover { color: var(--text); background: var(--surface3); }
    .ctrl-btn.danger:hover { color: var(--accent-red); border-color: var(--accent-red); }
    #event-count { margin-left: auto; font-size: 11px; color: var(--text-muted); }
  </style>
</head>
<body>
<div id="app">
  <!-- SIDEBAR -->
  <div id="sidebar">
    <div id="sidebar-header">Hockey Stats Tracker</div>
    <div id="sidebar-scroll">
      <!-- HOME TEAM -->
      <div class="team-panel" id="panel-home">
        <div class="team-header">
          <div class="team-label">
            <div class="team-dot" style="background:var(--home-color)"></div>
            <input class="team-name-input" id="home-team-name" value="Home" maxlength="16" />
          </div>
          <button class="btn-add" onclick="startAddPlayer('home')">+ Add</button>
        </div>
        <div id="add-form-home"></div>
        <div class="roster-list" id="roster-home"></div>
      </div>
      <!-- AWAY TEAM -->
      <div class="team-panel" id="panel-away">
        <div class="team-header">
          <div class="team-label">
            <div class="team-dot" style="background:var(--away-color)"></div>
            <input class="team-name-input" id="away-team-name" value="Away" maxlength="16" />
          </div>
          <button class="btn-add" onclick="startAddPlayer('away')">+ Add</button>
        </div>
        <div id="add-form-away"></div>
        <div class="roster-list" id="roster-away"></div>
      </div>
      <!-- STAT SELECTOR -->
      <div id="stat-selector">
        <div class="section-title">Stat Type</div>
        <div class="stat-grid" id="stat-grid"></div>
      </div>
      <!-- FEED -->
      <div id="stat-feed">
        <div class="section-title">Event Log</div>
        <ul id="feed-list"></ul>
      </div>
    </div>
  </div>

  <!-- RINK AREA -->
  <div id="rink-area">
    <!-- CLOCK BAR -->
    <div id="clock-bar">
      <div class="period-btns">
        <button class="period-btn active" onclick="setPeriod(1)">P1</button>
        <button class="period-btn" onclick="setPeriod(2)">P2</button>
        <button class="period-btn" onclick="setPeriod(3)">P3</button>
        <button class="period-btn" onclick="setPeriod(4)">OT</button>
      </div>
      <div id="clock-display">20:00</div>
      <div class="clock-step-group">
        <button class="step-btn" onclick="stepClock(-60)" title="−1 min">−1m</button>
        <button class="step-btn" onclick="stepClock(-10)" title="−10 sec">−10s</button>
        <button class="step-btn" onclick="stepClock(-1)" title="−1 sec">−1s</button>
      </div>
      <span class="clock-sep">|</span>
      <div class="clock-step-group">
        <button class="step-btn" onclick="stepClock(1)" title="+1 sec">+1s</button>
        <button class="step-btn" onclick="stepClock(10)" title="+10 sec">+10s</button>
        <button class="step-btn" onclick="stepClock(60)" title="+1 min">+1m</button>
      </div>
      <button id="clock-toggle" onclick="toggleClock()">&#9654; Start</button>
    </div>
    <!-- STATUS STRIP -->
    <div id="status-strip"></div>
    <!-- RINK -->
    <div id="rink-wrap">
      <svg id="rink-svg" viewBox="0 0 610 286" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <g class="rink-deco">
          <!-- outer shadow/bg -->
          <rect x="0" y="0" width="610" height="286" fill="#0a0e1a"/>

          <!-- ICE SURFACE -->
          <rect id="ice-surface" x="5" y="5" width="600" height="276" rx="30"
            fill="#ddeef8" stroke="#555" stroke-width="3"/>

          <!-- GOAL LINES (red, 11ft from ends) -->
          <line x1="66" y1="18" x2="66" y2="268" stroke="#c00" stroke-width="2.5"/>
          <line x1="544" y1="18" x2="544" y2="268" stroke="#c00" stroke-width="2.5"/>

          <!-- BLUE LINES (~75ft from each end) -->
          <line x1="183" y1="5" x2="183" y2="281" stroke="#2255cc" stroke-width="5"/>
          <line x1="427" y1="5" x2="427" y2="281" stroke="#2255cc" stroke-width="5"/>

          <!-- CENTER RED LINE (solid with center stripe) -->
          <line x1="305" y1="5" x2="305" y2="281" stroke="#c00" stroke-width="3.5"/>
          <!-- white stripe down center -->
          <line x1="305" y1="5" x2="305" y2="281" stroke="#ddeef8" stroke-width="1" stroke-dasharray="12 8"/>

          <!-- ── LEFT END FACE-OFF CIRCLES (top & bottom) ── -->
          <!-- top-left -->
          <circle cx="111" cy="90" r="35" fill="none" stroke="#c00" stroke-width="2"/>
          <circle cx="111" cy="90" r="3.5" fill="#c00"/>
          <!-- hash marks: 4 short lines from the dot -->
          <line x1="101" y1="84" x2="101" y2="96" stroke="#c00" stroke-width="2"/>
          <line x1="121" y1="84" x2="121" y2="96" stroke="#c00" stroke-width="2"/>
          <line x1="105" y1="80" x2="117" y2="80" stroke="#c00" stroke-width="2"/>
          <line x1="105" y1="100" x2="117" y2="100" stroke="#c00" stroke-width="2"/>
          <!-- bottom-left -->
          <circle cx="111" cy="196" r="35" fill="none" stroke="#c00" stroke-width="2"/>
          <circle cx="111" cy="196" r="3.5" fill="#c00"/>
          <line x1="101" y1="190" x2="101" y2="202" stroke="#c00" stroke-width="2"/>
          <line x1="121" y1="190" x2="121" y2="202" stroke="#c00" stroke-width="2"/>
          <line x1="105" y1="186" x2="117" y2="186" stroke="#c00" stroke-width="2"/>
          <line x1="105" y1="206" x2="117" y2="206" stroke="#c00" stroke-width="2"/>

          <!-- ── RIGHT END FACE-OFF CIRCLES (top & bottom) ── -->
          <!-- top-right -->
          <circle cx="499" cy="90" r="35" fill="none" stroke="#c00" stroke-width="2"/>
          <circle cx="499" cy="90" r="3.5" fill="#c00"/>
          <line x1="489" y1="84" x2="489" y2="96" stroke="#c00" stroke-width="2"/>
          <line x1="509" y1="84" x2="509" y2="96" stroke="#c00" stroke-width="2"/>
          <line x1="493" y1="80" x2="505" y2="80" stroke="#c00" stroke-width="2"/>
          <line x1="493" y1="100" x2="505" y2="100" stroke="#c00" stroke-width="2"/>
          <!-- bottom-right -->
          <circle cx="499" cy="196" r="35" fill="none" stroke="#c00" stroke-width="2"/>
          <circle cx="499" cy="196" r="3.5" fill="#c00"/>
          <line x1="489" y1="190" x2="489" y2="202" stroke="#c00" stroke-width="2"/>
          <line x1="509" y1="190" x2="509" y2="202" stroke="#c00" stroke-width="2"/>
          <line x1="493" y1="186" x2="505" y2="186" stroke="#c00" stroke-width="2"/>
          <line x1="493" y1="206" x2="505" y2="206" stroke="#c00" stroke-width="2"/>

          <!-- ── NEUTRAL ZONE FACE-OFF DOTS ── -->
          <circle cx="183" cy="90" r="4" fill="#c00"/>
          <circle cx="183" cy="196" r="4" fill="#c00"/>
          <circle cx="427" cy="90" r="4" fill="#c00"/>
          <circle cx="427" cy="196" r="4" fill="#c00"/>

          <!-- ── CENTER CIRCLE (blue) ── -->
          <circle cx="305" cy="143" r="50" fill="none" stroke="#2255cc" stroke-width="2.5"/>
          <circle cx="305" cy="143" r="4" fill="#c00"/>
          <!-- center hash marks -->
          <line x1="293" y1="137" x2="293" y2="149" stroke="#c00" stroke-width="2"/>
          <line x1="317" y1="137" x2="317" y2="149" stroke="#c00" stroke-width="2"/>

          <!-- ── LEFT GOAL CREASE ── -->
          <!-- filled D-shape opening right from goal line -->
          <path d="M 66 120 A 26 26 0 0 1 66 166 Z" fill="#b8d4f0" stroke="#2255cc" stroke-width="1.8"/>

          <!-- ── RIGHT GOAL CREASE ── -->
          <path d="M 544 120 A 26 26 0 0 0 544 166 Z" fill="#b8d4f0" stroke="#2255cc" stroke-width="1.8"/>

          <!-- ── LEFT NET (behind goal line) ── -->
          <rect x="35" y="126" width="31" height="34" rx="2" fill="#e8e8e8" stroke="#555" stroke-width="1.5"/>
          <line x1="43" y1="126" x2="43" y2="160" stroke="#aaa" stroke-width=".8"/>
          <line x1="51" y1="126" x2="51" y2="160" stroke="#aaa" stroke-width=".8"/>
          <line x1="59" y1="126" x2="59" y2="160" stroke="#aaa" stroke-width=".8"/>
          <line x1="35" y1="134" x2="66" y2="134" stroke="#aaa" stroke-width=".8"/>
          <line x1="35" y1="143" x2="66" y2="143" stroke="#aaa" stroke-width=".8"/>
          <line x1="35" y1="152" x2="66" y2="152" stroke="#aaa" stroke-width=".8"/>
          <!-- goal post marks on goal line -->
          <line x1="66" y1="126" x2="66" y2="160" stroke="#c00" stroke-width="3"/>

          <!-- ── RIGHT NET (behind goal line) ── -->
          <rect x="544" y="126" width="31" height="34" rx="2" fill="#e8e8e8" stroke="#555" stroke-width="1.5"/>
          <line x1="552" y1="126" x2="552" y2="160" stroke="#aaa" stroke-width=".8"/>
          <line x1="560" y1="126" x2="560" y2="160" stroke="#aaa" stroke-width=".8"/>
          <line x1="568" y1="126" x2="568" y2="160" stroke="#aaa" stroke-width=".8"/>
          <line x1="544" y1="134" x2="575" y2="134" stroke="#aaa" stroke-width=".8"/>
          <line x1="544" y1="143" x2="575" y2="143" stroke="#aaa" stroke-width=".8"/>
          <line x1="544" y1="152" x2="575" y2="152" stroke="#aaa" stroke-width=".8"/>
          <line x1="544" y1="126" x2="544" y2="160" stroke="#c00" stroke-width="3"/>

          <!-- ── REFEREE CREASE (bottom center) ── -->
          <path d="M 288 281 A 17 17 0 0 1 322 281" fill="none" stroke="#c00" stroke-width="1.8"/>

          <!-- RINK BORDER (drawn on top to crisp up edges) -->
          <rect x="5" y="5" width="600" height="276" rx="30"
            fill="none" stroke="#444" stroke-width="3"/>
        </g>

        <!-- CLICK CAPTURE -->
        <rect id="ice-click-layer" x="5" y="5" width="600" height="276" rx="30"/>

        <!-- MARKERS -->
        <g id="markers-layer"></g>
      </svg>
    </div>
    <div id="controls-bar">
      <button class="ctrl-btn" onclick="clearLastMarker()">&#8629; Undo Last</button>
      <button class="ctrl-btn danger" onclick="clearAllMarkers()">&#10005; Clear All</button>
      <button class="ctrl-btn" onclick="exportStats()">&#8659; Export CSV</button>
      <span id="event-count">0 events</span>
    </div>
  </div>
</div>

<!-- PLAYER STATS MODAL -->
<div id="modal-overlay" onclick="closeModal(event)">
  <div id="modal">
    <div id="modal-header">
      <div id="modal-title"></div>
      <button id="modal-close" onclick="closeModal()">&#215;</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script>
// ── CONSTANTS ──────────────────────────────────────────────────────────────
const STAT_TYPES = [
  { key: 'goal',       label: 'Goal',          sym: 'GL',  color: '#fbbf24' },
  { key: 'shot',       label: 'Shot on Goal',  sym: 'SG',  color: '#60a5fa' },
  { key: 'hit',        label: 'Hit',           sym: 'HT',  color: '#fb923c' },
  { key: 'turnover',   label: 'Turnover',      sym: 'TO',  color: '#c084fc' },
  { key: 'takeaway',   label: 'Takeaway',      sym: 'TK',  color: '#34d399' },
  { key: 'blocked',    label: 'Blocked Shot',  sym: 'BS',  color: '#22d3ee' },
  { key: 'penalty',    label: 'Penalty',       sym: 'PN',  color: '#f87171' },
  { key: 'faceoff_w',  label: 'Faceoff Win',   sym: 'FW',  color: '#4ade80' },
  { key: 'faceoff_l',  label: 'Faceoff Loss',  sym: 'FL',  color: '#f87171' },
];

// ── CLOCK STATE ────────────────────────────────────────────────────────────
const CLOCK = {
  period: 1,
  seconds: 1200,
  running: false,
  intervalId: null,
};

function periodStartSeconds(p) { return p === 4 ? 300 : 1200; }

function setPeriod(p) {
  if (CLOCK.running) stopClock();
  CLOCK.period = p;
  CLOCK.seconds = periodStartSeconds(p);
  document.querySelectorAll('.period-btn').forEach((b, i) => {
    b.classList.toggle('active', i + 1 === p);
  });
  renderClock();
}

function stepClock(delta) {
  const max = periodStartSeconds(CLOCK.period);
  CLOCK.seconds = Math.max(0, Math.min(max, CLOCK.seconds + delta));
  renderClock();
}

function toggleClock() {
  if (CLOCK.running) stopClock(); else startClock();
}

function startClock() {
  if (CLOCK.seconds <= 0) return;
  CLOCK.running = true;
  CLOCK.intervalId = setInterval(() => {
    CLOCK.seconds--;
    renderClock();
    if (CLOCK.seconds <= 0) stopClock();
  }, 1000);
  renderClock();
}

function stopClock() {
  CLOCK.running = false;
  clearInterval(CLOCK.intervalId);
  CLOCK.intervalId = null;
  renderClock();
}

function renderClock() {
  const m = Math.floor(CLOCK.seconds / 60);
  const s = CLOCK.seconds % 60;
  const display = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const el = document.getElementById('clock-display');
  el.textContent = display;
  el.className = CLOCK.seconds <= 0 ? 'expired' : CLOCK.running ? 'running' : '';
  const tog = document.getElementById('clock-toggle');
  if (CLOCK.running) {
    tog.className = 'running';
    tog.innerHTML = '&#9646;&#9646; Stop';
  } else {
    tog.className = '';
    tog.innerHTML = '&#9654; Start';
  }
}

function clockLabel() {
  const periodNames = ['P1','P2','P3','OT'];
  const m = Math.floor(CLOCK.seconds / 60);
  const s = CLOCK.seconds % 60;
  return `${periodNames[CLOCK.period - 1]} ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// ── MAIN STATE ─────────────────────────────────────────────────────────────
const STATE = {
  teams: {
    home: { name: 'Home', players: [] },
    away: { name: 'Away', players: [] },
  },
  selectedPlayerId: null,
  selectedTeam: null,
  selectedStat: null,
  events: [],
  nextId: 1,
};

let editingPlayerId = null;

// ── HELPERS ────────────────────────────────────────────────────────────────
function uid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
function getTeamColor(team) { return team === 'home' ? '#3b82f6' : '#ef4444'; }

function getZone(x, team) {
  if (team === 'home') {
    if (x < 183) return 'Def Zone';
    if (x > 427) return 'Off Zone';
    return 'Neutral';
  } else {
    if (x > 427) return 'Def Zone';
    if (x < 183) return 'Off Zone';
    return 'Neutral';
  }
}

function zoneClass(zone) {
  if (zone === 'Def Zone') return 'zone-d';
  if (zone === 'Off Zone') return 'zone-o';
  return 'zone-n';
}

function getStatDef(key) { return STAT_TYPES.find(s => s.key === key); }

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── ROSTER RENDER ──────────────────────────────────────────────────────────
function renderRoster(team) {
  const players = STATE.teams[team].players;
  const el = document.getElementById('roster-' + team);
  const color = getTeamColor(team);

  if (players.length === 0) {
    el.innerHTML = `<div style="padding:6px 14px;font-size:11px;color:var(--text-muted)">No players — click + Add</div>`;
    return;
  }

  el.innerHTML = players.map(p => {
    const isSelected = STATE.selectedPlayerId === p.id;
    if (editingPlayerId === p.id) {
      return `<div class="inline-form">
        <input class="num" id="edit-num-${p.id}" value="${esc(p.number)}" maxlength="2" placeholder="#" />
        <input class="name" id="edit-name-${p.id}" value="${esc(p.name)}" maxlength="30" placeholder="Name" />
        <button class="btn-confirm" onclick="confirmEdit('${p.id}','${team}')">&#10003;</button>
        <button class="btn-cancel" onclick="cancelEdit()">&#10005;</button>
      </div>`;
    }
    return `<div class="player-item ${isSelected ? 'selected ' + team : ''}" onclick="selectPlayer('${p.id}','${team}')">
      <div class="jersey-badge" style="background:${color}22;color:${color};border:1px solid ${color}44">#${esc(p.number)}</div>
      <div class="player-name" title="${esc(p.name)}">${esc(p.name)}</div>
      <div class="player-actions">
        <button class="icon-btn" title="View stats" onclick="event.stopPropagation();openModal('${p.id}')">&#128202;</button>
        <button class="icon-btn" title="Edit" onclick="event.stopPropagation();startEdit('${p.id}')">&#9998;</button>
        <button class="icon-btn danger" title="Delete" onclick="event.stopPropagation();deletePlayer('${p.id}','${team}')">&#128465;</button>
      </div>
    </div>`;
  }).join('');
}

function renderAllRosters() { renderRoster('home'); renderRoster('away'); }

// ── STAT BUTTONS ───────────────────────────────────────────────────────────
function renderStatButtons() {
  document.getElementById('stat-grid').innerHTML = STAT_TYPES.map(s => `
    <button class="stat-btn ${STATE.selectedStat === s.key ? 'active' : ''}"
        onclick="selectStat('${s.key}')" title="${s.label}">
      <span style="display:block;font-size:13px;font-weight:800;letter-spacing:.5px;margin-bottom:2px;color:${STATE.selectedStat === s.key ? '#93c5fd' : s.color}">${s.sym}</span>${s.label}
    </button>`).join('');
}

// ── STATUS STRIP ───────────────────────────────────────────────────────────
function renderStatus() {
  const strip = document.getElementById('status-strip');
  const player = STATE.selectedPlayerId ? findPlayer(STATE.selectedPlayerId, STATE.selectedTeam) : null;
  const stat = STATE.selectedStat ? getStatDef(STATE.selectedStat) : null;
  const teamColor = STATE.selectedTeam ? getTeamColor(STATE.selectedTeam) : '#64748b';
  const teamName = STATE.selectedTeam ? STATE.teams[STATE.selectedTeam].name : '';

  let html = '';
  if (!player && !stat) {
    html = `<span style="color:var(--text-muted)">Select a player, then a stat, then click the ice.</span>`;
  } else {
    html += player
      ? `<span class="status-chip" style="background:${teamColor}22;border-color:${teamColor}44;color:${teamColor}">#${esc(player.number)} ${esc(player.name)} <span style="opacity:.6">(${esc(teamName)})</span></span>`
      : `<span class="status-chip" style="color:var(--text-muted)">&#8592; select player</span>`;
    html += `<span class="status-arrow">&#8250;</span>`;
    html += stat
      ? `<span class="status-chip" style="background:${stat.color}22;border-color:${stat.color}44;color:${stat.color}">${stat.sym} ${stat.label}</span>`
      : `<span class="status-chip" style="color:var(--text-muted)">&#8592; select stat</span>`;
    if (player && stat) html += `<span class="status-hint">&#9658; Click the ice to log</span>`;
  }
  strip.innerHTML = html;
}

// ── FEED ───────────────────────────────────────────────────────────────────
function renderFeed() {
  const list = document.getElementById('feed-list');
  if (STATE.events.length === 0) {
    list.innerHTML = `<li class="feed-empty">No events yet.<br/>Select a player, a stat, and click the rink.</li>`;
    document.getElementById('event-count').textContent = '0 events';
    return;
  }
  list.innerHTML = [...STATE.events].reverse().slice(0, 80).map(ev => {
    const s = getStatDef(ev.stat);
    const zc = zoneClass(ev.zone);
    const tc = getTeamColor(ev.team);
    return `<li class="feed-item">
      <div class="feed-row1">
        <span class="feed-stat-badge" style="color:${s.color}">${s.sym} ${s.label}</span>
        <span class="feed-player" style="color:${tc}">#${esc(ev.playerNumber)} ${esc(ev.playerName)}</span>
        <span class="feed-time">${ev.timeLabel}</span>
      </div>
      <div class="feed-row2"><span class="${zc}">${ev.zone}</span></div>
    </li>`;
  }).join('');
  document.getElementById('event-count').textContent = `${STATE.events.length} event${STATE.events.length !== 1 ? 's' : ''}`;
}

function prependFeedItem(ev) {
  const list = document.getElementById('feed-list');
  const empty = list.querySelector('.feed-empty');
  if (empty) empty.remove();
  const s = getStatDef(ev.stat);
  const zc = zoneClass(ev.zone);
  const tc = getTeamColor(ev.team);
  const li = document.createElement('li');
  li.className = 'feed-item';
  li.innerHTML = `
    <div class="feed-row1">
      <span class="feed-stat-badge" style="color:${s.color}">${s.sym} ${s.label}</span>
      <span class="feed-player" style="color:${tc}">#${esc(ev.playerNumber)} ${esc(ev.playerName)}</span>
      <span class="feed-time">${ev.timeLabel}</span>
    </div>
    <div class="feed-row2"><span class="${zc}">${ev.zone}</span></div>`;
  list.insertBefore(li, list.firstChild);
  document.getElementById('event-count').textContent = `${STATE.events.length} event${STATE.events.length !== 1 ? 's' : ''}`;
}

// ── PLAYER ACTIONS ─────────────────────────────────────────────────────────
function startAddPlayer(team) {
  const formEl = document.getElementById('add-form-' + team);
  formEl.innerHTML = `<div class="inline-form">
    <input class="num" id="new-num-${team}" maxlength="2" placeholder="#" type="number" min="0" max="99" />
    <input class="name" id="new-name-${team}" maxlength="30" placeholder="Player name" />
    <button class="btn-confirm" onclick="confirmAddPlayer('${team}')">&#10003;</button>
    <button class="btn-cancel" onclick="cancelAddPlayer('${team}')">&#10005;</button>
  </div>`;
  document.getElementById('new-name-' + team).focus();
  ['new-num-' + team, 'new-name-' + team].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') confirmAddPlayer(team); });
  });
}

function cancelAddPlayer(team) { document.getElementById('add-form-' + team).innerHTML = ''; }

function confirmAddPlayer(team) {
  const num = document.getElementById('new-num-' + team).value.trim();
  const name = document.getElementById('new-name-' + team).value.trim();
  if (!name) { alert('Player name required.'); return; }
  if (num === '' || isNaN(num) || +num < 0 || +num > 99) { alert('Jersey number must be 0–99.'); return; }
  if (STATE.teams[team].players.some(p => p.number === num) && !confirm(`#${num} already on this team. Add anyway?`)) return;
  STATE.teams[team].players.push({ id: uid(), name, number: num });
  cancelAddPlayer(team);
  renderRoster(team);
}

function startEdit(id) {
  editingPlayerId = id;
  renderAllRosters();
  setTimeout(() => { const inp = document.getElementById('edit-name-' + id); if (inp) inp.focus(); }, 0);
}

function confirmEdit(id, team) {
  const num = document.getElementById('edit-num-' + id).value.trim();
  const name = document.getElementById('edit-name-' + id).value.trim();
  if (!name) { alert('Player name required.'); return; }
  if (num === '' || isNaN(num) || +num < 0 || +num > 99) { alert('Jersey number must be 0–99.'); return; }
  const p = findPlayer(id, team);
  if (p) { p.name = name; p.number = num; }
  STATE.events.forEach(ev => { if (ev.playerId === id) { ev.playerName = name; ev.playerNumber = num; } });
  editingPlayerId = null;
  renderRoster(team);
  renderFeed();
}

function cancelEdit() { editingPlayerId = null; renderAllRosters(); }

function deletePlayer(id, team) {
  if (!confirm('Delete this player and all their events?')) return;
  STATE.teams[team].players = STATE.teams[team].players.filter(p => p.id !== id);
  STATE.events = STATE.events.filter(ev => {
    if (ev.playerId !== id) return true;
    const m = document.querySelector(`[data-event-id="${ev.id}"]`);
    if (m) m.remove();
    return false;
  });
  if (STATE.selectedPlayerId === id) { STATE.selectedPlayerId = null; STATE.selectedTeam = null; }
  renderRoster(team);
  renderFeed();
  renderStatus();
}

function selectPlayer(id, team) {
  if (editingPlayerId) return;
  STATE.selectedPlayerId = id;
  STATE.selectedTeam = team;
  renderAllRosters();
  renderStatus();
}

function selectStat(key) {
  STATE.selectedStat = key;
  renderStatButtons();
  renderStatus();
}

// ── FIND HELPERS ───────────────────────────────────────────────────────────
function findPlayer(id, team) {
  if (team) return STATE.teams[team].players.find(p => p.id === id);
  for (const t of ['home','away']) { const p = STATE.teams[t].players.find(p => p.id === id); if (p) return p; }
  return null;
}

function findTeamForPlayer(id) {
  for (const t of ['home','away']) { if (STATE.teams[t].players.find(p => p.id === id)) return t; }
  return null;
}

// ── ICE CLICK ──────────────────────────────────────────────────────────────
document.getElementById('ice-click-layer').addEventListener('click', function(e) {
  if (!STATE.selectedPlayerId || !STATE.selectedStat) {
    showNudge(!STATE.selectedPlayerId ? 'Select a player first!' : 'Select a stat first!');
    return;
  }
  const svg = document.getElementById('rink-svg');
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const ctm = svg.getScreenCTM();
  if (!ctm) return;
  const svgPt = pt.matrixTransform(ctm.inverse());

  const player = findPlayer(STATE.selectedPlayerId, STATE.selectedTeam);
  if (!player) return;

  const ev = {
    id: STATE.nextId++,
    playerId: player.id,
    playerName: player.name,
    playerNumber: player.number,
    team: STATE.selectedTeam,
    stat: STATE.selectedStat,
    x: Math.round(svgPt.x),
    y: Math.round(svgPt.y),
    zone: getZone(svgPt.x, STATE.selectedTeam),
    timeLabel: clockLabel(),
  };
  STATE.events.push(ev);
  placeMarker(ev);
  prependFeedItem(ev);
});

function showNudge(msg) {
  const strip = document.getElementById('status-strip');
  const orig = strip.innerHTML;
  strip.innerHTML = `<span style="color:#fbbf24;font-weight:600">&#9888; ${msg}</span>`;
  setTimeout(() => { strip.innerHTML = orig; }, 1500);
}

// ── MARKERS ────────────────────────────────────────────────────────────────
function placeMarker(ev) {
  const layer = document.getElementById('markers-layer');
  const stat = getStatDef(ev.stat);
  const teamColor = getTeamColor(ev.team);
  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('class','stat-marker');
  g.setAttribute('data-event-id', ev.id);
  g.setAttribute('transform', `translate(${ev.x},${ev.y})`);
  g.style.opacity = '0';
  g.innerHTML = markerSVG(ev.stat, stat, teamColor, ev);
  layer.appendChild(g);
  requestAnimationFrame(() => { g.style.transition = 'opacity .2s'; g.style.opacity = '1'; });
  g.addEventListener('click', e => { e.stopPropagation(); g.style.filter='brightness(1.6)'; setTimeout(() => { g.style.filter=''; }, 300); });
}

function markerSVG(key, stat, teamColor, ev) {
  const t = `<title>#${ev.playerNumber} ${ev.playerName} — ${stat.label} (${ev.zone}) ${ev.timeLabel}</title>`;
  switch (key) {
    case 'goal':      return `${t}<circle r="9" fill="${stat.color}" stroke="#000" stroke-width=".8" opacity=".95"/><text text-anchor="middle" dominant-baseline="central" font-size="8" fill="#000" font-weight="800">GL</text>`;
    case 'shot':      return `${t}<circle r="7" fill="${teamColor}" stroke="#fff" stroke-width="1" opacity=".9"/><circle r="2.5" fill="white"/>`;
    case 'hit':       return `${t}<rect x="-7" y="-7" width="14" height="14" rx="2" fill="${stat.color}" stroke="#000" stroke-width=".6" opacity=".9"/><text text-anchor="middle" dominant-baseline="central" font-size="8" fill="#000" font-weight="800">HT</text>`;
    case 'turnover':  return `${t}<circle r="7" fill="${stat.color}" stroke="#000" stroke-width=".6" opacity=".9"/><text text-anchor="middle" dominant-baseline="central" font-size="9" fill="#000" font-weight="800">&#9660;</text>`;
    case 'takeaway':  return `${t}<circle r="7" fill="${stat.color}" stroke="#000" stroke-width=".6" opacity=".9"/><text text-anchor="middle" dominant-baseline="central" font-size="9" fill="#000" font-weight="800">&#9650;</text>`;
    case 'blocked':   return `${t}<rect x="-7" y="-7" width="14" height="14" rx="1" fill="${stat.color}" stroke="#000" stroke-width=".6" opacity=".9"/><text text-anchor="middle" dominant-baseline="central" font-size="8" fill="#000" font-weight="800">BS</text>`;
    case 'penalty':   return `${t}<circle r="7" fill="${stat.color}" stroke="#000" stroke-width=".6" opacity=".9"/><text text-anchor="middle" dominant-baseline="central" font-size="8" fill="#fff" font-weight="800">PN</text>`;
    case 'faceoff_w': return `${t}<circle r="7" fill="${stat.color}" stroke="#000" stroke-width=".6" opacity=".9"/><text text-anchor="middle" dominant-baseline="central" font-size="8" fill="#000" font-weight="800">FW</text>`;
    case 'faceoff_l': return `${t}<circle r="7" fill="${stat.color}" stroke="#000" stroke-width=".6" opacity=".9"/><text text-anchor="middle" dominant-baseline="central" font-size="8" fill="#fff" font-weight="800">FL</text>`;
    default:          return `${t}<circle r="6" fill="${teamColor}" opacity=".85"/>`;
  }
}

// ── CONTROLS ───────────────────────────────────────────────────────────────
function clearLastMarker() {
  if (!STATE.events.length) return;
  const ev = STATE.events.pop();
  const m = document.querySelector(`[data-event-id="${ev.id}"]`);
  if (m) m.remove();
  renderFeed();
}

function clearAllMarkers() {
  if (!STATE.events.length) return;
  if (!confirm('Clear all markers and events?')) return;
  STATE.events = [];
  document.getElementById('markers-layer').innerHTML = '';
  renderFeed();
}

function exportStats() {
  if (!STATE.events.length) { alert('No events to export.'); return; }
  const header = 'Time,Period,Team,#,Player,Stat,Zone,X,Y';
  const rows = STATE.events.map(ev =>
    [ev.timeLabel, ev.team, ev.playerNumber, `"${ev.playerName}"`,
     getStatDef(ev.stat).label, ev.zone, ev.x, ev.y].join(','));
  const a = document.createElement('a');
  a.href = 'data:text/csv,' + encodeURIComponent([header, ...rows].join('\n'));
  a.download = 'hockey-stats.csv';
  a.click();
}

// ── MODAL ──────────────────────────────────────────────────────────────────
function openModal(playerId) {
  const team = findTeamForPlayer(playerId);
  const player = findPlayer(playerId, team);
  if (!player) return;
  const events = STATE.events.filter(ev => ev.playerId === playerId);
  const teamColor = getTeamColor(team);
  const teamName = STATE.teams[team].name;

  document.getElementById('modal-title').innerHTML =
    `<span style="color:${teamColor}">#${esc(player.number)}</span> ${esc(player.name)} <span style="font-size:12px;color:var(--text-muted);font-weight:400">(${esc(teamName)})</span>`;

  const counts = {};
  events.forEach(ev => { counts[ev.stat] = (counts[ev.stat] || 0) + 1; });
  const nonZero = STAT_TYPES.filter(s => counts[s.key] > 0);

  const summaryHtml = nonZero.length ? `<div class="stat-summary-grid">${nonZero.map(s =>
    `<div class="summary-card"><div class="sc-num" style="color:${s.color}">${counts[s.key]}</div><div class="sc-label">${s.label}</div></div>`
  ).join('')}</div>` : '';

  const tableHtml = events.length === 0
    ? `<div class="no-stats">No events logged for this player yet.</div>`
    : `<table class="modal-table">
        <thead><tr><th>Time</th><th>Stat</th><th>Zone</th><th>Coords</th></tr></thead>
        <tbody>${[...events].reverse().map(ev => {
          const s = getStatDef(ev.stat);
          return `<tr>
            <td>${ev.timeLabel}</td>
            <td><span style="color:${s.color}">${s.sym} ${s.label}</span></td>
            <td class="${zoneClass(ev.zone)}">${ev.zone}</td>
            <td style="color:var(--text-muted)">${ev.x}, ${ev.y}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>`;

  document.getElementById('modal-body').innerHTML = summaryHtml + tableHtml;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').classList.remove('open');
}

// ── TEAM NAME EDIT ─────────────────────────────────────────────────────────
document.getElementById('home-team-name').addEventListener('input', function() { STATE.teams.home.name = this.value || 'Home'; renderStatus(); });
document.getElementById('away-team-name').addEventListener('input', function() { STATE.teams.away.name = this.value || 'Away'; renderStatus(); });
