<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hockey Stats Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0e1a;
      --surface: #111827;
      --surface2: #1e2a3a;
      --surface3: #253347;
      --accent-blue: #2563eb;
      --accent-red: #dc2626;
      --text: #e2e8f0;
      --text-muted: #64748b;
      --home-color: #3b82f6;
      --away-color: #ef4444;
      --border: #1e3050;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; font-size: 14px; overflow: hidden; }

    #app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }

    /* ── SIDEBAR ── */
    #sidebar { display: flex; flex-direction: column; background: var(--surface); border-right: 1px solid var(--border); overflow: hidden; }

    #sidebar-header { padding: 10px 14px; background: var(--bg); border-bottom: 1px solid var(--border); }
    #sidebar-header h1 { font-size: 14px; font-weight: 700; letter-spacing: .4px; color: #fff; margin-bottom: 6px; }
    #game-title-input {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 5px; color: var(--text); font-size: 12px; padding: 5px 8px; outline: none;
    }
    #game-title-input:focus { border-color: var(--accent-blue); }
    #game-title-input::placeholder { color: var(--text-muted); }

    #sidebar-scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    #sidebar-scroll::-webkit-scrollbar { width: 4px; }
    #sidebar-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .section-title { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-muted); padding: 10px 14px 4px; }

    /* ── TEAM PANELS ── */
    .team-panel { border-bottom: 1px solid var(--border); }
    .team-header { display: flex; align-items: center; justify-content: space-between; padding: 7px 14px; background: var(--surface2); }
    .team-label { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
    .team-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .team-name-input { background: transparent; border: none; border-bottom: 1px dashed var(--text-muted); color: var(--text); font-size: 13px; font-weight: 600; width: 100px; outline: none; }
    .btn-add { font-size: 11px; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface3); color: var(--text); cursor: pointer; transition: background .15s; }
    .btn-add:hover { background: var(--accent-blue); border-color: var(--accent-blue); }
    .roster-list { padding: 4px 0; min-height: 10px; }

    .player-item { display: flex; align-items: center; gap: 8px; padding: 5px 14px; cursor: pointer; transition: background .1s; border-left: 3px solid transparent; }
    .player-item:hover { background: var(--surface2); }
    .player-item.selected { background: var(--surface3); }
    .player-item.selected.home { border-left-color: var(--home-color); }
    .player-item.selected.away { border-left-color: var(--away-color); }
    .jersey-badge { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; flex-shrink: 0; }
    .player-name { flex: 1; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-actions { display: flex; gap: 4px; opacity: 0; transition: opacity .1s; }
    .player-item:hover .player-actions { opacity: 1; }
    .icon-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 13px; padding: 2px 3px; border-radius: 3px; transition: color .1s, background .1s; line-height: 1; }
    .icon-btn:hover { color: var(--text); background: var(--surface); }
    .icon-btn.danger:hover { color: var(--accent-red); }
    .inline-form { display: flex; gap: 4px; align-items: center; padding: 4px 14px; background: var(--surface3); }
    .inline-form input { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; color: var(--text); padding: 3px 6px; font-size: 12px; outline: none; }
    .inline-form input:focus { border-color: var(--accent-blue); }
    .inline-form input.num { width: 42px; }
    .inline-form input.name { flex: 1; }
    .btn-confirm { background: var(--accent-blue); border: none; color: #fff; border-radius: 4px; padding: 3px 8px; cursor: pointer; font-size: 11px; }
    .btn-cancel { background: none; border: 1px solid var(--border); color: var(--text-muted); border-radius: 4px; padding: 3px 6px; cursor: pointer; font-size: 11px; }

    /* ── STAT FEED ── */
    #stat-feed { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #feed-list { list-style: none; overflow-y: auto; flex: 1; }
    #feed-list::-webkit-scrollbar { width: 4px; }
    #feed-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
    .feed-item { display: flex; flex-direction: column; gap: 2px; padding: 6px 14px; border-bottom: 1px solid var(--border); animation: fadeIn .2s ease; }
    .feed-item:hover { background: var(--surface2); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    .feed-row1 { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .feed-stat-badge { font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 3px; background: var(--surface3); text-transform: uppercase; letter-spacing: .5px; white-space: nowrap; }
    .feed-player { font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .feed-time { font-size: 10px; color: var(--text-muted); white-space: nowrap; }
    .feed-row2 { font-size: 10px; color: var(--text-muted); }
    .zone-d { color: #f87171; }
    .zone-n { color: #94a3b8; }
    .zone-o { color: #34d399; }
    .zone-hd { color: #ff9900; font-weight: 700; }
    .feed-empty { padding: 20px 14px; text-align: center; color: var(--text-muted); font-size: 12px; }

    /* ── MANAGE STATS SECTION ── */
    #manage-stats-row { padding: 8px 14px; border-bottom: 1px solid var(--border); }
    .manage-btn { width: 100%; font-size: 11px; padding: 5px 10px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted); cursor: pointer; transition: all .12s; text-align: left; }
    .manage-btn:hover { color: var(--text); background: var(--surface3); border-color: var(--accent-blue); }

    /* ── RINK AREA ── */
    #rink-area { display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }

    /* ── CLOCK BAR ── */
    #clock-bar { display: flex; align-items: center; gap: 10px; padding: 7px 16px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .period-btns { display: flex; gap: 4px; }
    .period-btn { font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted); cursor: pointer; transition: all .12s; }
    .period-btn:hover { color: var(--text); background: var(--surface3); }
    .period-btn.active { background: #1d3a6e; border-color: var(--accent-blue); color: #93c5fd; }
    #clock-display { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 1px; color: #fff; min-width: 70px; text-align: center; }
    #clock-display.running { color: #4ade80; }
    #clock-display.expired { color: #f87171; }
    .clock-step-group { display: flex; gap: 3px; align-items: center; }
    .step-btn { font-size: 10px; font-weight: 600; padding: 3px 7px; border-radius: 4px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted); cursor: pointer; transition: all .12s; }
    .step-btn:hover { color: var(--text); background: var(--surface3); }
    .clock-sep { color: var(--border); font-size: 10px; }
    #clock-toggle { font-size: 11px; font-weight: 700; padding: 5px 14px; border-radius: 5px; border: 1px solid var(--accent-blue); background: #1d3a6e; color: #93c5fd; cursor: pointer; transition: all .12s; margin-left: 4px; }
    #clock-toggle:hover { background: var(--accent-blue); color: #fff; }
    #clock-toggle.running { border-color: #f87171; background: #3a1d1d; color: #f87171; }
    #clock-toggle.running:hover { background: #f87171; color: #fff; }

    /* ── STATUS STRIP ── */
    #status-strip { display: flex; align-items: center; gap: 10px; padding: 6px 16px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 12px; min-height: 34px; flex-wrap: wrap; }
    .status-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; border: 1px solid var(--border); }
    .status-hint { color: var(--text-muted); font-size: 11px; margin-left: auto; }

    /* ── RINK ── */
    #rink-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px; min-height: 0; }
    #rink-svg { width: 100%; height: 100%; max-height: 100%; filter: drop-shadow(0 4px 24px rgba(0,0,0,.5)); }
    #rink-svg .rink-deco { pointer-events: none; }
    #ice-click-layer { pointer-events: all; fill: transparent; cursor: crosshair; }
    .stat-marker { pointer-events: all; cursor: pointer; transition: opacity .15s; }
    .stat-marker:hover { opacity: .75; }
    .stat-marker.delete-candidate { outline: none; }
    .stat-marker.delete-candidate circle,
    .stat-marker.delete-candidate rect { stroke: #fff; stroke-width: 2; }

    /* ── CONTROLS ── */
    #controls-bar { display: flex; gap: 8px; padding: 7px 16px; background: var(--surface); border-top: 1px solid var(--border); align-items: center; }
    .ctrl-btn { font-size: 11px; padding: 4px 10px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted); cursor: pointer; transition: all .12s; }
    .ctrl-btn:hover { color: var(--text); background: var(--surface3); }
    .ctrl-btn.danger:hover { color: var(--accent-red); border-color: var(--accent-red); }
    #event-count { margin-left: auto; font-size: 11px; color: var(--text-muted); }

    /* ── STAT POPUP ── */
    #stat-popup {
      display: none; position: fixed; z-index: 200;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px;
      box-shadow: 0 12px 40px rgba(0,0,0,.7);
      width: 210px;
    }
    #stat-popup.open { display: block; }
    #stat-popup-header { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--text-muted); margin-bottom: 6px; }
    #stat-popup-existing { margin-bottom: 6px; }
    .existing-event-row {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 8px; border-radius: 6px;
      background: var(--surface2); margin-bottom: 4px;
      font-size: 11px;
    }
    .existing-event-label { flex: 1; font-weight: 600; }
    .btn-delete-event { background: none; border: 1px solid var(--accent-red); color: var(--accent-red); border-radius: 4px; padding: 2px 7px; cursor: pointer; font-size: 10px; font-weight: 700; }
    .btn-delete-event:hover { background: var(--accent-red); color: #fff; }
    #stat-popup-add-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .8px; color: var(--text-muted); margin-bottom: 5px; padding-top: 4px; border-top: 1px solid var(--border); }
    #stat-popup-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 6px; }
    .popup-stat-btn { padding: 6px 3px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 9px; font-weight: 600; cursor: pointer; text-align: center; transition: background .1s, transform .1s; line-height: 1.3; }
    .popup-stat-btn:hover { background: var(--surface3); transform: translateY(-1px); }
    .popup-stat-btn .psym { display: block; font-size: 12px; font-weight: 800; margin-bottom: 1px; }
    .popup-cancel { width: 100%; font-size: 11px; padding: 5px; border-radius: 5px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; margin-top: 2px; }
    .popup-cancel:hover { background: var(--surface2); color: var(--text); }
    .hdz-notice { font-size: 10px; color: #ff9900; font-weight: 700; background: #ff990018; border: 1px solid #ff990044; border-radius: 4px; padding: 4px 7px; margin-bottom: 6px; }

    /* ── MODALS ── */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 500px; max-width: 95vw; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.6); }
    .modal-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); }
    .modal-title { font-size: 15px; font-weight: 700; }
    .modal-close { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
    .modal-close:hover { color: var(--text); background: var(--surface2); }
    .modal-body { overflow-y: auto; padding: 16px 20px; flex: 1; }

    /* player stats modal */
    .stat-summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
    .summary-card { background: var(--surface2); border-radius: 8px; padding: 10px; text-align: center; }
    .summary-card .sc-num { font-size: 22px; font-weight: 700; }
    .summary-card .sc-label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }
    .modal-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .modal-table th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); color: var(--text-muted); font-size: 10px; text-transform: uppercase; letter-spacing: .5px; }
    .modal-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); }
    .modal-table tr:last-child td { border-bottom: none; }
    .modal-table tr:hover td { background: var(--surface2); }
    .no-stats { color: var(--text-muted); text-align: center; padding: 24px; font-size: 13px; }

    /* stat manager modal */
    #stat-manager-list { list-style: none; }
    .stat-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .stat-row:last-child { border-bottom: none; }
    .stat-color-swatch { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
    .stat-row-sym { font-size: 11px; font-weight: 800; min-width: 26px; }
    .stat-row-label { flex: 1; font-size: 12px; }
    .lock-badge { font-size: 9px; color: var(--text-muted); background: var(--surface2); border-radius: 3px; padding: 1px 5px; }
    .stat-edit-form { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; width: 100%; padding: 6px 0; }
    .stat-edit-form input[type=text] { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; color: var(--text); padding: 3px 6px; font-size: 12px; outline: none; }
    .stat-edit-form input[type=text]:focus { border-color: var(--accent-blue); }
    .stat-edit-form input.sym-in { width: 38px; font-weight: 800; }
    .stat-edit-form input.label-in { flex: 1; min-width: 80px; }
    .stat-edit-form input[type=color] { width: 32px; height: 24px; border: 1px solid var(--border); border-radius: 4px; background: none; cursor: pointer; padding: 1px; }
    #add-stat-form { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    #add-stat-form input[type=text] { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; color: var(--text); padding: 4px 7px; font-size: 12px; outline: none; }
    #add-stat-form input[type=text]:focus { border-color: var(--accent-blue); }
    #add-stat-form input.sym-in { width: 42px; font-weight: 800; }
    #add-stat-form input.label-in { flex: 1; min-width: 80px; }
    #add-stat-form input[type=color] { width: 32px; height: 28px; border: 1px solid var(--border); border-radius: 4px; background: none; cursor: pointer; padding: 1px; }
  </style>
</head>
<body>
<div id="app">
  <!-- SIDEBAR -->
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>Hockey Stats Tracker</h1>
      <input id="game-title-input" type="text" placeholder="Game title (e.g. EDM vs COL — May 29)" maxlength="60" />
    </div>
    <div id="sidebar-scroll">
      <!-- HOME -->
      <div class="team-panel" id="panel-home">
        <div class="team-header">
          <div class="team-label"><div class="team-dot" style="background:var(--home-color)"></div><input class="team-name-input" id="home-team-name" value="Home" maxlength="16" /></div>
          <button class="btn-add" onclick="startAddPlayer('home')">+ Add</button>
        </div>
        <div id="add-form-home"></div>
        <div class="roster-list" id="roster-home"></div>
      </div>
      <!-- AWAY -->
      <div class="team-panel" id="panel-away">
        <div class="team-header">
          <div class="team-label"><div class="team-dot" style="background:var(--away-color)"></div><input class="team-name-input" id="away-team-name" value="Away" maxlength="16" /></div>
          <button class="btn-add" onclick="startAddPlayer('away')">+ Add</button>
        </div>
        <div id="add-form-away"></div>
        <div class="roster-list" id="roster-away"></div>
      </div>
      <!-- MANAGE STATS -->
      <div id="manage-stats-row">
        <button class="manage-btn" onclick="openStatManager()">&#9881; Manage Stat Types&hellip;</button>
      </div>
      <!-- FEED -->
      <div id="stat-feed">
        <div class="section-title">Event Log</div>
        <ul id="feed-list"></ul>
      </div>
    </div>
  </div>

  <!-- RINK AREA -->
  <div id="rink-area">
    <!-- CLOCK -->
    <div id="clock-bar">
      <div class="period-btns">
        <button class="period-btn active" onclick="setPeriod(1)">P1</button>
        <button class="period-btn" onclick="setPeriod(2)">P2</button>
        <button class="period-btn" onclick="setPeriod(3)">P3</button>
        <button class="period-btn" onclick="setPeriod(4)">OT</button>
      </div>
      <div id="clock-display">20:00</div>
      <div class="clock-step-group">
        <button class="step-btn" onclick="stepClock(-60)">&#8722;1m</button>
        <button class="step-btn" onclick="stepClock(-10)">&#8722;10s</button>
        <button class="step-btn" onclick="stepClock(-1)">&#8722;1s</button>
      </div>
      <span class="clock-sep">|</span>
      <div class="clock-step-group">
        <button class="step-btn" onclick="stepClock(1)">+1s</button>
        <button class="step-btn" onclick="stepClock(10)">+10s</button>
        <button class="step-btn" onclick="stepClock(60)">+1m</button>
      </div>
      <button id="clock-toggle" onclick="toggleClock()">&#9654; Start</button>
    </div>
    <!-- STATUS -->
    <div id="status-strip"></div>
    <!-- RINK -->
    <div id="rink-wrap">
      <svg id="rink-svg" viewBox="0 0 610 286" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
        <g class="rink-deco">
          <rect x="0" y="0" width="610" height="286" fill="#0a0e1a"/>
          <!-- Ice -->
          <rect x="5" y="5" width="600" height="276" rx="30" fill="#ddeef8" stroke="#555" stroke-width="3"/>

          <!-- HIGH DANGER ZONES (semi-transparent, both ends) -->
          <!-- Left HDZ: trapezoid from goal line outward -->
          <polygon points="66,126 66,160 172,214 172,72" fill="#ff440018" stroke="#ff6600" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.85"/>
          <!-- Right HDZ: mirror -->
          <polygon points="544,126 544,160 438,214 438,72" fill="#ff440018" stroke="#ff6600" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.85"/>
          <!-- HDZ label left -->
          <text x="100" y="144" text-anchor="middle" font-size="7" fill="#ff6600" opacity="0.7" font-family="system-ui" font-weight="700">HIGH</text>
          <text x="100" y="153" text-anchor="middle" font-size="7" fill="#ff6600" opacity="0.7" font-family="system-ui" font-weight="700">DANGER</text>
          <!-- HDZ label right -->
          <text x="510" y="144" text-anchor="middle" font-size="7" fill="#ff6600" opacity="0.7" font-family="system-ui" font-weight="700">HIGH</text>
          <text x="510" y="153" text-anchor="middle" font-size="7" fill="#ff6600" opacity="0.7" font-family="system-ui" font-weight="700">DANGER</text>

          <!-- GOAL LINES -->
          <line x1="66" y1="18" x2="66" y2="268" stroke="#c00" stroke-width="2.5"/>
          <line x1="544" y1="18" x2="544" y2="268" stroke="#c00" stroke-width="2.5"/>

          <!-- BLUE LINES -->
          <line x1="183" y1="5" x2="183" y2="281" stroke="#2255cc" stroke-width="5"/>
          <line x1="427" y1="5" x2="427" y2="281" stroke="#2255cc" stroke-width="5"/>

          <!-- CENTER RED LINE -->
          <line x1="305" y1="5" x2="305" y2="281" stroke="#c00" stroke-width="3.5"/>
          <line x1="305" y1="5" x2="305" y2="281" stroke="#ddeef8" stroke-width="1" stroke-dasharray="12 8"/>

          <!-- LEFT FACE-OFF CIRCLES -->
          <circle cx="111" cy="90" r="35" fill="none" stroke="#c00" stroke-width="2"/>
          <circle cx="111" cy="90" r="3.5" fill="#c00"/>
          <line x1="101" y1="84" x2="101" y2="96" stroke="#c00" stroke-width="2"/>
          <line x1="121" y1="84" x2="121" y2="96" stroke="#c00" stroke-width="2"/>
          <line x1="105" y1="80" x2="117" y2="80" stroke="#c00" stroke-width="2"/>
          <line x1="105" y1="100" x2="117" y2="100" stroke="#c00" stroke-width="2"/>
          <circle cx="111" cy="196" r="35" fill="none" stroke="#c00" stroke-width="2"/>
          <circle cx="111" cy="196" r="3.5" fill="#c00"/>

<script>
// ── PERMANENT STAT KEYS (cannot be deleted) ────────────────────────────────
const PERMANENT_KEYS = new Set(['shot', 'high_danger']);

// ── DEFAULT STATS ──────────────────────────────────────────────────────────
const DEFAULT_STATS = [
  { key: 'high_danger', label: 'High Danger Shot', sym: 'HD',  color: '#ff6600', permanent: true },
  { key: 'shot',        label: 'Shot on Goal',     sym: 'SG',  color: '#60a5fa', permanent: true },
  { key: 'goal',        label: 'Goal',             sym: 'GL',  color: '#fbbf24' },
  { key: 'hit',         label: 'Hit',              sym: 'HT',  color: '#fb923c' },
  { key: 'turnover',    label: 'Turnover',         sym: 'TO',  color: '#c084fc' },
  { key: 'takeaway',    label: 'Takeaway',         sym: 'TK',  color: '#34d399' },
  { key: 'blocked',     label: 'Blocked Shot',     sym: 'BS',  color: '#22d3ee' },
  { key: 'penalty',     label: 'Penalty',          sym: 'PN',  color: '#f87171' },
  { key: 'faceoff_w',   label: 'Faceoff Win',      sym: 'FW',  color: '#4ade80' },
  { key: 'faceoff_l',   label: 'Faceoff Loss',     sym: 'FL',  color: '#f87171' },
];

// ── HIGH DANGER ZONE POLYGONS ──────────────────────────────────────────────
// Left HDZ: trapezoid from goal line (x=66) outward to x=172
// Right HDZ: mirror
const LEFT_HDZ  = [[66,126],[66,160],[172,214],[172,72]];
const RIGHT_HDZ = [[544,126],[544,160],[438,214],[438,72]];

function pointInPoly(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

function isInHDZ(x, y) {
  return pointInPoly(x, y, LEFT_HDZ) || pointInPoly(x, y, RIGHT_HDZ);
}

// ── CLOCK ──────────────────────────────────────────────────────────────────
const CLOCK = { period: 1, seconds: 1200, running: false, intervalId: null };

function periodStart(p) { return p === 4 ? 300 : 1200; }

function setPeriod(p) {
  if (CLOCK.running) stopClock();
  CLOCK.period = p;
  CLOCK.seconds = periodStart(p);
  document.querySelectorAll('.period-btn').forEach((b, i) => b.classList.toggle('active', i + 1 === p));
  renderClock();
}

function stepClock(d) {
  CLOCK.seconds = Math.max(0, Math.min(periodStart(CLOCK.period), CLOCK.seconds + d));
  renderClock();
}

function toggleClock() { CLOCK.running ? stopClock() : startClock(); }

function startClock() {
  if (CLOCK.seconds <= 0) return;
  CLOCK.running = true;
  CLOCK.intervalId = setInterval(() => { CLOCK.seconds--; renderClock(); if (CLOCK.seconds <= 0) stopClock(); }, 1000);
  renderClock();
}

function stopClock() {
  CLOCK.running = false; clearInterval(CLOCK.intervalId); CLOCK.intervalId = null; renderClock();
}

function renderClock() {
  const m = Math.floor(CLOCK.seconds / 60), s = CLOCK.seconds % 60;
  const el = document.getElementById('clock-display');
  el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  el.className = CLOCK.seconds <= 0 ? 'expired' : CLOCK.running ? 'running' : '';
  const tog = document.getElementById('clock-toggle');
  tog.className = CLOCK.running ? 'running' : '';
  tog.innerHTML = CLOCK.running ? '&#9646;&#9646; Stop' : '&#9654; Start';
}

function clockLabel() {
  const pn = ['P1','P2','P3','OT'][CLOCK.period - 1];
  const m = Math.floor(CLOCK.seconds / 60), s = CLOCK.seconds % 60;
  return `${pn} ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// ── MAIN STATE ─────────────────────────────────────────────────────────────
const STATE = {
  teams: { home: { name: 'Home', players: [] }, away: { name: 'Away', players: [] } },
  selectedPlayerId: null,
  selectedTeam: null,
  events: [],
  nextId: 1,
  statTypes: DEFAULT_STATS.map(s => ({ ...s })),
  gameTitle: '',
};

let editingPlayerId = null;
let pendingClick = null; // { svgX, svgY, screenX, screenY }
let editingStatKey = null;

// ── HELPERS ────────────────────────────────────────────────────────────────
function uid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
function getTeamColor(t) { return t === 'home' ? '#3b82f6' : '#ef4444'; }

function getZone(x, team) {
  if (team === 'home') {
    if (x < 183) return 'Def Zone'; if (x > 427) return 'Off Zone'; return 'Neutral';
  } else {
    if (x > 427) return 'Def Zone'; if (x < 183) return 'Off Zone'; return 'Neutral';
  }
}

function zoneClass(z) { return z === 'Def Zone' ? 'zone-d' : z === 'Off Zone' ? 'zone-o' : 'zone-n'; }
function getStatDef(key) { return STATE.statTypes.find(s => s.key === key) || { key, label: key, sym: '?', color: '#888' }; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── ROSTER ─────────────────────────────────────────────────────────────────
function renderRoster(team) {
  const players = STATE.teams[team].players;
  const el = document.getElementById('roster-' + team);
  const color = getTeamColor(team);
  if (!players.length) { el.innerHTML = `<div style="padding:6px 14px;font-size:11px;color:var(--text-muted)">No players — click + Add</div>`; return; }
  el.innerHTML = players.map(p => {
    if (editingPlayerId === p.id) return `<div class="inline-form">
      <input class="num" id="edit-num-${p.id}" value="${esc(p.number)}" maxlength="2" placeholder="#"/>
      <input class="name" id="edit-name-${p.id}" value="${esc(p.name)}" maxlength="30" placeholder="Name"/>
      <button class="btn-confirm" onclick="confirmEdit('${p.id}','${team}')">&#10003;</button>
      <button class="btn-cancel" onclick="cancelEdit()">&#10005;</button>
    </div>`;
    const sel = STATE.selectedPlayerId === p.id;
    return `<div class="player-item ${sel ? 'selected ' + team : ''}" onclick="selectPlayer('${p.id}','${team}')">
      <div class="jersey-badge" style="background:${color}22;color:${color};border:1px solid ${color}44">#${esc(p.number)}</div>
      <div class="player-name">${esc(p.name)}</div>
      <div class="player-actions">
        <button class="icon-btn" title="Stats" onclick="event.stopPropagation();openPlayerModal('${p.id}')">&#128202;</button>
        <button class="icon-btn" title="Edit" onclick="event.stopPropagation();startEdit('${p.id}')">&#9998;</button>
        <button class="icon-btn danger" title="Delete" onclick="event.stopPropagation();deletePlayer('${p.id}','${team}')">&#128465;</button>
      </div>
    </div>`;
  }).join('');
}

function renderAllRosters() { renderRoster('home'); renderRoster('away'); }

// ── PLAYER CRUD ────────────────────────────────────────────────────────────
function startAddPlayer(team) {
  const el = document.getElementById('add-form-' + team);
  el.innerHTML = `<div class="inline-form">
    <input class="num" id="new-num-${team}" maxlength="2" placeholder="#" type="number" min="0" max="99"/>
    <input class="name" id="new-name-${team}" maxlength="30" placeholder="Player name"/>
    <button class="btn-confirm" onclick="confirmAddPlayer('${team}')">&#10003;</button>
    <button class="btn-cancel" onclick="cancelAddPlayer('${team}')">&#10005;</button>
  </div>`;
  document.getElementById('new-name-' + team).focus();
  ['new-num-' + team, 'new-name-' + team].forEach(id =>
    document.getElementById(id).addEventListener('keydown', e => { if (e.key === 'Enter') confirmAddPlayer(team); }));
}

function cancelAddPlayer(t) { document.getElementById('add-form-' + t).innerHTML = ''; }

function confirmAddPlayer(team) {
  const num = document.getElementById('new-num-' + team).value.trim();
  const name = document.getElementById('new-name-' + team).value.trim();
  if (!name) { alert('Player name required.'); return; }
  if (num === '' || isNaN(num) || +num < 0 || +num > 99) { alert('Jersey number must be 0–99.'); return; }
  if (STATE.teams[team].players.some(p => p.number === num) && !confirm(`#${num} already on this team. Add anyway?`)) return;
  STATE.teams[team].players.push({ id: uid(), name, number: num });
  cancelAddPlayer(team); renderRoster(team);
}

function startEdit(id) {
  editingPlayerId = id; renderAllRosters();
  setTimeout(() => { const el = document.getElementById('edit-name-' + id); if (el) el.focus(); }, 0);
}

function confirmEdit(id, team) {
  const num = document.getElementById('edit-num-' + id).value.trim();
  const name = document.getElementById('edit-name-' + id).value.trim();
  if (!name) { alert('Player name required.'); return; }
  if (num === '' || isNaN(num) || +num < 0 || +num > 99) { alert('Jersey number must be 0–99.'); return; }
  const p = findPlayer(id, team);
  if (p) { p.name = name; p.number = num; }
  STATE.events.forEach(ev => { if (ev.playerId === id) { ev.playerName = name; ev.playerNumber = num; } });
  editingPlayerId = null; renderRoster(team); renderFeed();
}

function cancelEdit() { editingPlayerId = null; renderAllRosters(); }

function deletePlayer(id, team) {
  if (!confirm('Delete this player and all their events?')) return;
  STATE.teams[team].players = STATE.teams[team].players.filter(p => p.id !== id);
  STATE.events = STATE.events.filter(ev => {
    if (ev.playerId !== id) return true;
    const m = document.querySelector(`[data-event-id="${ev.id}"]`); if (m) m.remove(); return false;
  });
  if (STATE.selectedPlayerId === id) { STATE.selectedPlayerId = null; STATE.selectedTeam = null; }
  renderRoster(team); renderFeed(); renderStatus();
}

function selectPlayer(id, team) {
  if (editingPlayerId) return;
  STATE.selectedPlayerId = id; STATE.selectedTeam = team;
  renderAllRosters(); renderStatus();
}

function findPlayer(id, team) {
  if (team) return STATE.teams[team].players.find(p => p.id === id);
  for (const t of ['home','away']) { const p = STATE.teams[t].players.find(p => p.id === id); if (p) return p; }
  return null;
}

function findTeamForPlayer(id) {
  for (const t of ['home','away']) { if (STATE.teams[t].players.find(p => p.id === id)) return t; }
  return null;
}

// ── STATUS ─────────────────────────────────────────────────────────────────
function renderStatus() {
  const strip = document.getElementById('status-strip');
  const player = STATE.selectedPlayerId ? findPlayer(STATE.selectedPlayerId, STATE.selectedTeam) : null;
  const color = STATE.selectedTeam ? getTeamColor(STATE.selectedTeam) : '#64748b';
  const teamName = STATE.selectedTeam ? STATE.teams[STATE.selectedTeam].name : '';
  if (!player) {
    strip.innerHTML = `<span style="color:var(--text-muted)">Select a player, then click the ice to log a stat.</span>`;
  } else {
    strip.innerHTML = `<span class="status-chip" style="background:${color}22;border-color:${color}44;color:${color}">#${esc(player.number)} ${esc(player.name)} <span style="opacity:.6">(${esc(teamName)})</span></span><span class="status-hint">&#9658; Click the ice to log a stat</span>`;
  }
}

// ── FEED ───────────────────────────────────────────────────────────────────
function renderFeed() {
  const list = document.getElementById('feed-list');
  if (!STATE.events.length) {
    list.innerHTML = `<li class="feed-empty">No events yet. Select a player and click the rink.</li>`;
    document.getElementById('event-count').textContent = '0 events';
    return;
  }
  list.innerHTML = [...STATE.events].reverse().slice(0, 80).map(ev => {
    const s = getStatDef(ev.stat); const zc = s.key === 'high_danger' ? 'zone-hd' : zoneClass(ev.zone);
    return `<li class="feed-item">
      <div class="feed-row1">
        <span class="feed-stat-badge" style="color:${s.color}">${s.sym} ${s.label}</span>
        <span class="feed-player" style="color:${getTeamColor(ev.team)}">#${esc(ev.playerNumber)} ${esc(ev.playerName)}</span>
        <span class="feed-time">${ev.timeLabel}</span>
      </div>
      <div class="feed-row2"><span class="${zc}">${s.key === 'high_danger' ? 'High Danger Zone' : ev.zone}</span></div>
    </li>`;
  }).join('');
  document.getElementById('event-count').textContent = `${STATE.events.length} event${STATE.events.length !== 1 ? 's' : ''}`;
}

function prependFeedItem(ev) {
  const list = document.getElementById('feed-list');
  const empty = list.querySelector('.feed-empty'); if (empty) empty.remove();
  const s = getStatDef(ev.stat);
  const zc = s.key === 'high_danger' ? 'zone-hd' : zoneClass(ev.zone);
  const li = document.createElement('li'); li.className = 'feed-item';
  li.innerHTML = `
    <div class="feed-row1">
      <span class="feed-stat-badge" style="color:${s.color}">${s.sym} ${s.label}</span>
      <span class="feed-player" style="color:${getTeamColor(ev.team)}">#${esc(ev.playerNumber)} ${esc(ev.playerName)}</span>
      <span class="feed-time">${ev.timeLabel}</span>
    </div>
    <div class="feed-row2"><span class="${zc}">${s.key === 'high_danger' ? 'High Danger Zone' : ev.zone}</span></div>`;
  list.insertBefore(li, list.firstChild);
  document.getElementById('event-count').textContent = `${STATE.events.length} event${STATE.events.length !== 1 ? 's' : ''}`;
}

// ── ICE CLICK → STAT POPUP ────────────────────────────────────────────────
document.getElementById('ice-click-layer').addEventListener('click', function(e) {
  if (!STATE.selectedPlayerId) {
    showNudge('Select a player first!'); return;
  }
  const svg = document.getElementById('rink-svg');
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const ctm = svg.getScreenCTM(); if (!ctm) return;
  const sp = pt.matrixTransform(ctm.inverse());

  pendingClick = { svgX: Math.round(sp.x), svgY: Math.round(sp.y), screenX: e.clientX, screenY: e.clientY };
  showStatPopup();
});

function showStatPopup() {
  if (!pendingClick) return;
  const { svgX, svgY, screenX, screenY } = pendingClick;
  const hdz = isInHDZ(svgX, svgY);

  // Find nearby events from this player (within 14 SVG units)
  const nearby = STATE.events.filter(ev => {
    if (ev.playerId !== STATE.selectedPlayerId) return false;
    const d = Math.hypot(ev.x - svgX, ev.y - svgY);
    return d <= 14;
  });

  const popup = document.getElementById('stat-popup');
  const player = findPlayer(STATE.selectedPlayerId, STATE.selectedTeam);
  const color = getTeamColor(STATE.selectedTeam);

  document.getElementById('stat-popup-header').innerHTML =
    `<span style="color:${color}">#${esc(player.number)} ${esc(player.name)}</span>`;

  // Nearby deletable events
  const existingDiv = document.getElementById('stat-popup-existing');
  if (nearby.length) {
    existingDiv.innerHTML = nearby.map(ev => {
      const s = getStatDef(ev.stat);
      return `<div class="existing-event-row">
        <span class="stat-color-swatch" style="background:${s.color}"></span>
        <span class="existing-event-label" style="color:${s.color}">${s.sym} ${s.label}</span>
        <span style="font-size:10px;color:var(--text-muted)">${ev.timeLabel}</span>
        <button class="btn-delete-event" onclick="deleteEventFromPopup(${ev.id})">Delete</button>
      </div>`;
    }).join('');
  } else {
    existingDiv.innerHTML = '';
  }

  // HDZ notice
  const addLabel = document.getElementById('stat-popup-add-label');
  if (hdz) {
    addLabel.innerHTML = `<div class="hdz-notice">&#9888; High Danger Zone — shots auto-tagged HD</div><div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);margin-bottom:5px">Add Stat</div>`;
  } else {
    addLabel.innerHTML = nearby.length
      ? `<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);margin-bottom:5px;padding-top:6px;border-top:1px solid var(--border)">Add Stat Here</div>`
      : `<div style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--text-muted);margin-bottom:5px">Add Stat</div>`;
  }

  // Stat buttons
  const grid = document.getElementById('stat-popup-grid');
  grid.innerHTML = STATE.statTypes.map(s => `
    <button class="popup-stat-btn" onclick="confirmStatPick('${s.key}')" title="${s.label}">
      <span class="psym" style="color:${s.color}">${s.sym}</span>${s.label}
    </button>`).join('');

  // Position popup
  popup.classList.add('open');
  const pw = popup.offsetWidth || 210;
  const ph = popup.offsetHeight || 320;
  let left = screenX + 12, top = screenY + 12;
  if (left + pw > window.innerWidth - 8) left = screenX - pw - 12;
  if (top + ph > window.innerHeight - 8) top = screenY - ph - 12;
  popup.style.left = left + 'px';
  popup.style.top = top + 'px';
}

function confirmStatPick(statKey) {
  if (!pendingClick || !STATE.selectedPlayerId) { cancelStatPick(); return; }
  const { svgX, svgY } = pendingClick;
  const hdz = isInHDZ(svgX, svgY);

  // Auto-upgrade shots in HDZ
  let finalKey = statKey;
  if (hdz && (statKey === 'shot')) finalKey = 'high_danger';

  const player = findPlayer(STATE.selectedPlayerId, STATE.selectedTeam);
  const ev = {
    id: STATE.nextId++, playerId: player.id, playerName: player.name,
    playerNumber: player.number, team: STATE.selectedTeam, stat: finalKey,
    x: svgX, y: svgY, zone: getZone(svgX, STATE.selectedTeam), timeLabel: clockLabel(),
  };
  STATE.events.push(ev);
  placeMarker(ev);
  prependFeedItem(ev);
  cancelStatPick();
}

function deleteEventFromPopup(eventId) {
  const idx = STATE.events.findIndex(ev => ev.id === eventId);
  if (idx === -1) return;
  STATE.events.splice(idx, 1);
  const m = document.querySelector(`[data-event-id="${eventId}"]`); if (m) m.remove();
  renderFeed();
  cancelStatPick();
}

function cancelStatPick() {
  pendingClick = null;
  document.getElementById('stat-popup').classList.remove('open');
}

// Close popup when clicking outside
document.addEventListener('click', function(e) {
  const popup = document.getElementById('stat-popup');
  if (popup.classList.contains('open') && !popup.contains(e.target) && e.target.id !== 'ice-click-layer') {
    cancelStatPick();
  }
}, true);

function showNudge(msg) {
  const strip = document.getElementById('status-strip');
  const orig = strip.innerHTML;
  strip.innerHTML = `<span style="color:#fbbf24;font-weight:600">&#9888; ${msg}</span>`;
  setTimeout(() => { strip.innerHTML = orig; }, 1600);
}

// ── MARKERS ────────────────────────────────────────────────────────────────
function placeMarker(ev) {
  const layer = document.getElementById('markers-layer');
  const stat = getStatDef(ev.stat); const tc = getTeamColor(ev.team);
  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('class','stat-marker');
  g.setAttribute('data-event-id', ev.id);
  g.setAttribute('transform', `translate(${ev.x},${ev.y})`);
  g.style.opacity = '0';
  g.innerHTML = markerSVG(ev.stat, stat, tc, ev);
  layer.appendChild(g);
  requestAnimationFrame(() => { g.style.transition = 'opacity .2s'; g.style.opacity = '1'; });
}

function markerSVG(key, stat, tc, ev) {
  const t = `<title>#${ev.playerNumber} ${ev.playerName} — ${stat.label} (${ev.zone}) ${ev.timeLabel}</title>`;
  if (key === 'high_danger') return `${t}<circle r="9" fill="#ff6600" stroke="#fff" stroke-width="1" opacity=".95"/><text text-anchor="middle" dominant-baseline="central" font-size="7" fill="#fff" font-weight="800">HD</text>`;
  if (key === 'shot')        return `${t}<circle r="7" fill="${tc}" stroke="#fff" stroke-width="1" opacity=".9"/><circle r="2.5" fill="white"/>`;
  if (key === 'goal')        return `${t}<circle r="9" fill="${stat.color}" stroke="#000" stroke-width=".8" opacity=".95"/><text text-anchor="middle" dominant-baseline="central" font-size="7" fill="#000" font-weight="800">GL</text>`;
  return `${t}<circle r="7" fill="${stat.color}" stroke="#000" stroke-width=".5" opacity=".9"/><text text-anchor="middle" dominant-baseline="central" font-size="7" fill="#fff" font-weight="800">${esc(stat.sym.slice(0,2))}</text>`;
}

// ── CONTROLS ───────────────────────────────────────────────────────────────
function clearLastMarker() {
  if (!STATE.events.length) return;
  const ev = STATE.events.pop();
  const m = document.querySelector(`[data-event-id="${ev.id}"]`); if (m) m.remove();
  renderFeed();
}

function clearAllMarkers() {
  if (!STATE.events.length) return;
  if (!confirm('Clear all markers and events?')) return;
  STATE.events = []; document.getElementById('markers-layer').innerHTML = ''; renderFeed();
}

function exportStats() {
  if (!STATE.events.length) { alert('No events to export.'); return; }
  const title = STATE.gameTitle.trim() || 'hockey-stats';
  const header = `Game: ${title}\nTime,Team,#,Player,Stat,Zone,X,Y`;
  const rows = STATE.events.map(ev => {
    const s = getStatDef(ev.stat);
    return [ev.timeLabel, ev.team, ev.playerNumber, `"${ev.playerName}"`, s.label, ev.zone, ev.x, ev.y].join(',');
  });
  const a = document.createElement('a');
  a.href = 'data:text/csv,' + encodeURIComponent([header, ...rows].join('\n'));
  a.download = title.replace(/[^a-z0-9\-_]/gi,'_') + '.csv';
  a.click();
}

// ── PLAYER STATS MODAL ─────────────────────────────────────────────────────
function openPlayerModal(playerId) {
  const team = findTeamForPlayer(playerId); const player = findPlayer(playerId, team); if (!player) return;
  const events = STATE.events.filter(ev => ev.playerId === playerId);
  const tc = getTeamColor(team); const tn = STATE.teams[team].name;

  document.getElementById('modal-title').innerHTML =
    `<span style="color:${tc}">#${esc(player.number)}</span> ${esc(player.name)} <span style="font-size:11px;color:var(--text-muted);font-weight:400">(${esc(tn)})</span>`;

  const counts = {}; events.forEach(ev => { counts[ev.stat] = (counts[ev.stat] || 0) + 1; });
  const nonZero = STATE.statTypes.filter(s => counts[s.key] > 0);

  const summary = nonZero.length ? `<div class="stat-summary-grid">${nonZero.map(s =>
    `<div class="summary-card"><div class="sc-num" style="color:${s.color}">${counts[s.key]}</div><div class="sc-label">${s.label}</div></div>`
  ).join('')}</div>` : '';

  const table = !events.length ? `<div class="no-stats">No events yet.</div>`
    : `<table class="modal-table"><thead><tr><th>Time</th><th>Stat</th><th>Zone</th></tr></thead><tbody>${[...events].reverse().map(ev => {
        const s = getStatDef(ev.stat);
        const zc = s.key === 'high_danger' ? 'zone-hd' : zoneClass(ev.zone);
        return `<tr><td>${ev.timeLabel}</td><td><span style="color:${s.color}">${s.sym} ${s.label}</span></td><td class="${zc}">${s.key === 'high_danger' ? 'High Danger Zone' : ev.zone}</td></tr>`;
      }).join('')}</tbody></table>`;

  document.getElementById('modal-body').innerHTML = summary + table;
  document.getElementById('player-modal-overlay').classList.add('open');
}

function closePlayerModal(e) {
  if (e && e.target !== document.getElementById('player-modal-overlay')) return;
  document.getElementById('player-modal-overlay').classList.remove('open');
}

// ── STAT MANAGER ───────────────────────────────────────────────────────────
function openStatManager() {
  renderStatManagerList();
  document.getElementById('stat-manager-overlay').classList.add('open');
}

function closeStatManager(e) {
  if (e && e.target !== document.getElementById('stat-manager-overlay')) return;
  editingStatKey = null;
  document.getElementById('stat-manager-overlay').classList.remove('open');
}

function renderStatManagerList() {
  const ul = document.getElementById('stat-manager-list');
  ul.innerHTML = STATE.statTypes.map(s => {
    if (editingStatKey === s.key) {
      return `<li class="stat-row">
        <div class="stat-edit-form">
          <input class="sym-in" type="text" id="esym-${s.key}" value="${esc(s.sym)}" maxlength="3"/>
          <input class="label-in" type="text" id="elabel-${s.key}" value="${esc(s.label)}" maxlength="30"/>
          <input type="color" id="ecolor-${s.key}" value="${s.color}"/>
          <button class="btn-confirm" onclick="confirmEditStat('${s.key}')">&#10003;</button>
          <button class="btn-cancel" onclick="cancelEditStat()">&#10005;</button>
        </div>
      </li>`;
    }
    return `<li class="stat-row">
      <div class="stat-color-swatch" style="background:${s.color}"></div>
      <span class="stat-row-sym" style="color:${s.color}">${esc(s.sym)}</span>
      <span class="stat-row-label">${esc(s.label)}</span>
      ${s.permanent ? `<span class="lock-badge">locked</span>` : ''}
      <button class="icon-btn" title="Edit" onclick="startEditStat('${s.key}')">&#9998;</button>
      ${!s.permanent ? `<button class="icon-btn danger" title="Delete" onclick="deleteStatType('${s.key}')">&#128465;</button>` : ''}
    </li>`;
  }).join('');
}

function startEditStat(key) { editingStatKey = key; renderStatManagerList(); }
function cancelEditStat() { editingStatKey = null; renderStatManagerList(); }

function confirmEditStat(key) {
  const sym = document.getElementById('esym-' + key).value.trim().toUpperCase();
  const label = document.getElementById('elabel-' + key).value.trim();
  const color = document.getElementById('ecolor-' + key).value;
  if (!sym || !label) { alert('Symbol and label are required.'); return; }
  const s = STATE.statTypes.find(s => s.key === key);
  if (s) { s.sym = sym; s.label = label; s.color = color; }
  editingStatKey = null;
  renderStatManagerList();
  renderFeed();
}

function deleteStatType(key) {
  if (PERMANENT_KEYS.has(key)) return;
  const inUse = STATE.events.some(ev => ev.stat === key);
  if (inUse && !confirm('This stat is used in existing events. Delete it anyway? (events will be preserved with their original key)')) return;
  STATE.statTypes = STATE.statTypes.filter(s => s.key !== key);
  renderStatManagerList();
}

function confirmAddStat() {
  const sym = document.getElementById('new-stat-sym').value.trim().toUpperCase();
  const label = document.getElementById('new-stat-label').value.trim();
  const color = document.getElementById('new-stat-color').value;
  if (!sym || !label) { alert('Symbol and label are required.'); return; }
  const key = 'custom_' + uid().slice(0, 6);
  STATE.statTypes.push({ key, label, sym, color, permanent: false });
  document.getElementById('new-stat-sym').value = '';
  document.getElementById('new-stat-label').value = '';
  renderStatManagerList();
}

// ── TEAM NAME ──────────────────────────────────────────────────────────────
document.getElementById('home-team-name').addEventListener('input', function() { STATE.teams.home.name = this.value || 'Home'; renderStatus(); });
document.getElementById('away-team-name').addEventListener('input', function() { STATE.teams.away.name = this.value || 'Away'; renderStatus(); });
document.getElementById('game-title-input').addEventListener('input', function() { STATE.gameTitle = this.value; });

// ── INIT ───────────────────────────────────────────────────────────────────
function init() {
  STATE.teams.home.players = [
    { id: uid(), name: 'Connor McDavid', number: '97' },
    { id: uid(), name: 'Leon Draisaitl', number: '29' },
    { id: uid(), name: 'Zach Hyman', number: '18' },
  ];
  STATE.teams.away.players = [
    { id: uid(), name: 'Nathan MacKinnon', number: '29' },
    { id: uid(), name: 'Mikko Rantanen', number: '96' },
    { id: uid(), name: 'Cale Makar', number: '8' },
  ];
  renderAllRosters(); renderFeed(); renderStatus(); renderClock();
}

init();
</script>
